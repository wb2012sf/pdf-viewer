[package]
name = "pdf-workbench"
version = "0.1.0"
description = "View, annotate and OCR PDFs, entirely offline."
edition = "2021"
rust-version = "1.77.2"

[lib]
# Required for the mobile targets and harmless elsewhere; keeps `main.rs` a
# one-liner so all real setup lives in `lib.rs`.
name = "pdf_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Lets the app hand a file to the user's own save dialog. The webview ignores
# `<a download>`, so the browser build's save path does not survive packaging.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
# Used by `tauri dev` / `tauri build`; do not remove.
default = []
