# Builds the unsigned Windows installer on GitHub's Windows machines, so a
# release no longer depends on a local Rust/Visual Studio setup.
#
# - Push to main, or "Run workflow" by hand: the installer is attached to the
#   run as a downloadable artifact.
# - Push a tag such as v0.1.2: the installer is also attached to a *draft*
#   release, which stays invisible until it is published by hand. The tag
#   should match the version in src-tauri/tauri.conf.json.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # --locked: build exactly what Cargo.lock pins, so the crates cannot
      # drift away from the npm Tauri packages again.
      - run: npm run tauri:build -- -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: '*.exe'
